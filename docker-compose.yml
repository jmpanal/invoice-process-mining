services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: invoice-process-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_process_lab
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_process_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
